{% extends "base.html" %}

{% block title %}
<title>Register</title>
{% endblock title %}

{% block content %}
{% block navbar%}
{% endblock navbar %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow" style="background-color: rgba(34, 34, 34, 0.8); border-radius: 15px; border: none;">
                <div class="card-body">
                    <h1 class="text-center mb-4" style="color: #ffc107;">Register</h1>
                    <form method="post">
                        {% csrf_token %}
                        {% for field in form %}
                            <div class="mb-3">
                                <label for="{{ field.id_for_label }}" class="form-label" style="color: #ffc107;">{{ field.label }}</label>
                                {{ field }}
                                {% if field.errors %}
                                    <div class="text-danger small">
                                        {{ field.errors }}
                                    </div>
                                {% endif %}
                            </div>
                        {% endfor %}
                        <button type="submit" class="btn btn-primary w-100" style="border-radius: 15px;">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
